database:
  # h2 or postgresql
  type: h2
  # h2 only: file is created under the plugin folder
  file: data
  # postgresql only
  host: localhost
  port: 5432
  name: ploceus
  user: ploceus
  password: ''
  pool-size: 6

worlds:
  # minutes a world may sit empty before it is unloaded
  idle-unload-minutes: 30
  # how often the reaper checks, in seconds
  reaper-interval-seconds: 60
  # how often lastVisitedAt is flushed to the database, in seconds
  visit-flush-seconds: 30
  # worlds that must never be unloaded, in addition to the server default world
  never-unload: []
  defaults:
    generator: ''
    generator-settings: ''
    environment: NORMAL
    generate-structures: false
    biome: ''

ui:
  # lowest client protocol version that supports the Dialog API.
  # Adjust here if a protocol bump makes this wrong; no plugin release needed.
  min-dialog-protocol: 771
  entries-per-page: 10
