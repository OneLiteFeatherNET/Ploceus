# Packages such as ..ui.., ..command.. and ..service.. do not exist yet (later tasks add
# them). Until then, rules scoped to those packages match zero classes; without this,
# ArchUnit 1.5's default `archRule.failOnEmptyShould=true` treats that as a failure instead
# of a vacuous pass, breaking ArchitectureTest before the corresponding task lands.
archRule.failOnEmptyShould=false
